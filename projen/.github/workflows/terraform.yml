name: terraform
on:
  workflow_dispatch: {}
jobs:
  plan:
    name: Terraform Plan
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Terraform Init
        id: terraform_init
        run: terraform init -input=false -no-color
      - name: Terraform Plan
        id: terraform_plan
        run: terraform plan -input=false -no-color -var="vm_password=${{ secrets.VM_PASSWORD }}" -var="proxmox_api_token=${{ secrets.PROXMOX_API_TOKEN }}" -var="proxmox_endpoint=${{ secrets.PROXMOX_ENDPOINT }}"
