name: terraform-destroy
on:
  workflow_dispatch: {}
jobs:
  destroy:
    name: Terraform Destroy
    runs-on: self-hosted
    permissions:
      contents: read
    environment: terraform-apply
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Terraform Init
        id: terraform_init
        run: terraform init -input=false -no-color
      - name: Terraform Destroy
        id: terraform_destroy
        run: terraform destroy -auto-approve -input=false -no-color -var="vm_password=${{ secrets.VM_PASSWORD }}" -var="vm_username=${{ secrets.VM_USERNAME }}" -var="proxmox_api_token=${{ secrets.PROXMOX_API_TOKEN }}" -var="proxmox_endpoint=${{ secrets.PROXMOX_ENDPOINT }}"
