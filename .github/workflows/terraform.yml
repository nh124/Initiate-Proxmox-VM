name: terraform
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      vm_name:
        description: VM name
        required: true
        default: forgejo-dev-server
        type: string
      memory:
        description: Memory in MB
        required: true
        default: "2048"
        type: string
      cpu_cores:
        description: CPU cores
        required: true
        default: "2"
        type: string
      disk_size:
        description: Disk size in GB
        required: true
        default: "10"
        type: string
      node_name:
        description: Proxmox node
        required: true
        default: pve
        type: string
      datastore_id:
        description: VM datastore
        required: true
        default: big-4tb
        type: string
      vm_username:
        description: VM username
        required: true
        default: ubuntu
        type: string
jobs:
  plan:
    name: Terraform Plan
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Terraform Init
        id: terraform_init
        run: terraform init
      - name: Terraform Plan
        id: terraform_plan
        run: terraform plan -var="vm_name=${{ inputs.vm_name }}" -var="memory=${{ inputs.memory }}" -var="cpu_cores=${{ inputs.cpu_cores }}" -var="disk_size=${{ inputs.disk_size }}" -var="node_name=${{ inputs.node_name }}" -var="datastore_id=${{ inputs.datastore_id }}" -var="vm_username=${{ inputs.vm_username }}"
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: self-hosted
    permissions:
      contents: read
    environment: terraform-apply
    steps:
      - name: Terraform Apply
        id: terraform_apply
        run: terraform apply -var="vm_name=${{ inputs.vm_name }}" -var="memory=${{ inputs.memory }}" -var="cpu_cores=${{ inputs.cpu_cores }}" -var="disk_size=${{ inputs.disk_size }}" -var="node_name=${{ inputs.node_name }}" -var="datastore_id=${{ inputs.datastore_id }}" -var="vm_username=${{ inputs.vm_username }}"
