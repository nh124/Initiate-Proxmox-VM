name: terraform-apply
on:
  workflow_dispatch: {}
jobs:
  apply:
    name: Terraform Apply
    runs-on: self-hosted
    permissions:
      contents: read
    environment: terraform-apply
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Terraform Init
        id: terraform_init
        run: terraform init -input=false -no-color
      - name: Terraform Apply
        id: terraform_apply
        run: terraform apply -auto-approve -input=false -no-color -var="vm_password=${{ secrets.VM_PASSWORD }}" -var="proxmox_api_token=${{ secrets.PROXMOX_API_TOKEN }}"
