name: terraform-apply
on:
  workflow_dispatch: {}
jobs:
  plan:
    name: Terraform Plan
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Terraform Init
        id: terraform_init
        run: terraform init -input=false -no-color
      - name: Terraform Plan
        id: terraform_plan
        run: terraform plan -input=false -no-color -out=tfplan -var="proxmox_api_token=${{ secrets.PROXMOX_API_TOKEN }}" -var="proxmox_endpoint=${{ secrets.PROXMOX_ENDPOINT }}" | tee plan.txt
      - name: Add Plan to Summary
        id: add_plan_to_summary
        run: |-
          echo "## Terraform Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '\x60\x60\x60text\n' >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt >> "$GITHUB_STEP_SUMMARY"
          printf '\x60\x60\x60\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Terraform Plan
        id: upload_terraform_plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retentionDays: "1"
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: self-hosted
    permissions:
      contents: read
    environment: terraform-apply
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Download Terraform Plan
        id: download_terraform_plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
      - name: Terraform Init
        id: terraform_init
        run: terraform init -input=false -no-color
      - name: Terraform Apply
        id: terraform_apply
        run: terraform apply -input=false -no-color -auto-approve tfplan
      - name: Upload Talos Config
        id: upload_talos_config
        uses: actions/upload-artifact@v4
        with:
          name: talosconfig
          path: talos/talosconfig
          retentionDays: "1"
