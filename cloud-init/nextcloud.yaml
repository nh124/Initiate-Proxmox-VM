#cloud-config

package_update: true

packages:
  - ca-certificates
  - curl
  - git

write_files:
  - path: /opt/nextcloud/compose.yaml
    permissions: "0644"
    content: |
      services:

        db:
          image: postgres:16
          restart: unless-stopped
          environment:
            POSTGRES_DB: nextcloud
            POSTGRES_USER: nextcloud
            POSTGRES_PASSWORD: CHANGE_ME
          volumes:
            - /srv/nextcloud/postgres:/var/lib/postgresql/data

        redis:
          image: redis:7-alpine
          restart: unless-stopped

        app:
          image: nextcloud:apache
          restart: unless-stopped
          depends_on:
            - db
            - redis
          ports:
            - "8080:80"
          environment:
            POSTGRES_HOST: db
            POSTGRES_DB: nextcloud
            POSTGRES_USER: nextcloud
            POSTGRES_PASSWORD: CHANGE_ME
            REDIS_HOST: redis

            NEXTCLOUD_ADMIN_USER: admin
            NEXTCLOUD_ADMIN_PASSWORD: CHANGE_ME
            NEXTCLOUD_TRUSTED_DOMAINS: localhost 192.168.0.0/24

          volumes:
            - /srv/nextcloud/nextcloud:/var/www/html

        cron:
          image: nextcloud:apache
          restart: unless-stopped
          depends_on:
            - db
            - redis
          entrypoint: /cron.sh
          volumes:
            - /srv/nextcloud/nextcloud:/var/www/html

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable docker
  - systemctl start docker

  - mkdir -p /srv/nextcloud/postgres
  - mkdir -p /srv/nextcloud/nextcloud

  - cd /opt/nextcloud && docker compose up -d
